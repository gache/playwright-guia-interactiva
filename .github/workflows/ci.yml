name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Type-check and unit tests
        run: npx tsc -b && npm test
      - name: End-to-end tests of the guide
        run: npm run test:e2e
      - name: Exercises compile and run (mock server, no public sites)
        run: npm run verify:exercises:offline
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
